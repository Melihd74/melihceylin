<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030305">
  <meta name="description" content="Een kleine verrassing, met liefde gemaakt voor Ceylin.">
  <title>Voor Ceylin ♡</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #e5d29a;
      --pink: #f3b6cf;
      --ink: #030305;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--ink); }
    body {
      min-height: 100svh;
      overflow: hidden;
      color: #fff7ef;
      font-family: Georgia, 'Times New Roman', serif;
    }
    .scene {
      position: relative;
      isolation: isolate;
      display: flex;
      min-height: 100svh;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      padding: clamp(30px, 5.5vh, 58px) 18px clamp(24px, 4vh, 42px);
      background:
        radial-gradient(ellipse at 50% 48%, rgba(49, 34, 28, .23), transparent 42%),
        radial-gradient(ellipse at 50% 100%, rgba(98, 52, 70, .11), transparent 42%),
        #030305;
    }
    .scene::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      opacity: .45;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 12% 22%, rgba(255,231,184,.85) 50%, transparent 100%),
        radial-gradient(1px 1px at 82% 16%, rgba(255,231,184,.7) 50%, transparent 100%),
        radial-gradient(1px 1px at 74% 72%, rgba(255,231,184,.7) 50%, transparent 100%),
        radial-gradient(1px 1px at 23% 79%, rgba(255,231,184,.7) 50%, transparent 100%),
        radial-gradient(1px 1px at 52% 10%, rgba(255,231,184,.7) 50%, transparent 100%);
      animation: twinkle 4s ease-in-out infinite alternate;
    }
    .intro {
      z-index: 1;
      width: 100%;
      text-align: center;
      opacity: 0;
      animation: fade-in 1.4s ease .25s forwards;
    }
    .eyebrow {
      color: var(--gold);
      font-size: clamp(14px, 2.5vw, 18px);
      font-style: italic;
      letter-spacing: .035em;
      line-height: 1.5;
      text-shadow: 0 0 22px rgba(229,210,154,.22);
    }
    .subline {
      margin-top: 8px;
      color: rgba(245,235,221,.5);
      font: 9px/1.6 Arial, sans-serif;
      letter-spacing: .23em;
      text-transform: uppercase;
    }
    .flower-stage {
      position: relative;
      z-index: 1;
      display: grid;
      flex: 1 1 auto;
      place-items: center;
      width: 100%;
      min-height: 0;
      margin: 5px 0;
    }
    .flower-stage::before {
      content: "";
      position: absolute;
      width: min(74vw, 430px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(171,105,125,.12), transparent 68%);
      filter: blur(12px);
      pointer-events: none;
    }
    .flower-art {
      position: relative;
      display: block;
      width: min(92vw, 560px);
      height: min(62svh, 560px);
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(198,130,139,.12));
    }
    .footer {
      z-index: 2;
      display: flex;
      min-height: 88px;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 13px;
      text-align: center;
    }
    .footer-note {
      color: rgba(232,222,208,.54);
      font: 9px/1.5 Arial, sans-serif;
      letter-spacing: .25em;
      text-transform: uppercase;
      opacity: 0;
      animation: fade-in 1.2s ease .8s forwards;
    }
    .open-button {
      border: 1px solid rgba(229,210,154,.7);
      border-radius: 999px;
      padding: 13px 25px;
      background: rgba(142,77,100,.16);
      box-shadow: 0 0 24px rgba(197,113,144,.12), inset 0 0 18px rgba(255,255,255,.025);
      color: #f4dce5;
      font: 12px Arial, sans-serif;
      letter-spacing: .075em;
      cursor: pointer;
      opacity: 0;
      transform: translateY(9px);
      animation: button-in 1s ease 5.8s forwards;
      transition: background .25s, transform .25s, border-color .25s;
    }
    .open-button:hover {
      background: rgba(174,91,120,.26);
      border-color: #f0dca9;
      transform: translateY(-2px);
    }
    .open-button:focus-visible { outline: 2px solid var(--pink); outline-offset: 4px; }
    .reveal {
      position: fixed;
      z-index: 5;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: radial-gradient(ellipse at center, #21141d, #050507 70%);
      opacity: 0;
      visibility: hidden;
      transition: opacity .9s ease, visibility .9s ease;
    }
    .reveal.show { opacity: 1; visibility: visible; }
    .reveal-inner {
      max-width: 540px;
      transform: translateY(14px);
      transition: transform .9s ease;
    }
    .reveal.show .reveal-inner { transform: translateY(0); }
    .reveal-kicker { color: var(--gold); font-size: 12px; letter-spacing: .17em; }
    .reveal h1 {
      margin: 18px 0 14px;
      color: #f5dce8;
      font-size: clamp(38px, 9vw, 66px);
      font-weight: 400;
      font-style: italic;
    }
    .reveal p { color: rgba(255,242,247,.78); font-size: 16px; line-height: 1.85; }
    .close-button {
      margin-top: 22px;
      border: 0;
      background: transparent;
      color: var(--gold);
      text-decoration: underline;
      text-underline-offset: 5px;
      cursor: pointer;
      font-size: 13px;
    }
    @keyframes fade-in { to { opacity: 1; } }
    @keyframes button-in { to { opacity: 1; transform: translateY(0); } }
    @keyframes twinkle { from { opacity: .2; } to { opacity: .7; } }
    @media (max-height: 650px) {
      .scene { padding-top: 18px; padding-bottom: 18px; }
      .flower-art { height: min(56svh, 420px); }
      .footer { min-height: 70px; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <header class="intro">
      <div class="eyebrow">Bir güzellik senin için büyüyor... ♡</div>
      <div class="subline">Something beautiful is blooming for you, Ceylin</div>
    </header>

    <section class="flower-stage" aria-label="Een roze lelieboeket dat tot bloei komt">
      <img class="flower-art" src="lily-bloom.gif" alt="Een boeket roze en witte lelies dat langzaam openbloeit">
    </section>

    <footer class="footer">
      <div class="footer-note">voor mijn Ceylin ♡</div>
      <button class="open-button" id="openSurprise" type="button">Jouw verrassing openen ♡</button>
    </footer>
  </main>

  <section class="reveal" id="reveal" aria-hidden="true">
    <div class="reveal-inner">
      <div class="reveal-kicker">SENİN İÇİN, CEYLİN</div>
      <h1>Voor mijn Ceylin</h1>
      <p>Net zoals deze bloemen langzaam openbloeien, wordt mijn wereld elke dag mooier door jou. Seni çok seviyorum. ❤️</p>
      <button class="close-button" id="closeSurprise" type="button">Nog even terug naar de bloemen</button>
    </div>
  </section>

  <script>
    const reveal = document.getElementById('reveal');
    const openButton = document.getElementById('openSurprise');
    const closeButton = document.getElementById('closeSurprise');

    openButton.addEventListener('click', () => {
      reveal.classList.add('show');
      reveal.setAttribute('aria-hidden', 'false');
    });

    closeButton.addEventListener('click', () => {
      reveal.classList.remove('show');
      reveal.setAttribute('aria-hidden', 'true');
    });
  </script>
</body>
</html>
